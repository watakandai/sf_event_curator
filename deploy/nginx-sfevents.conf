# nginx reverse proxy for sfevents, with HTTP basic auth.
#
# WHY THIS EXISTS: the FastAPI dashboard has no authentication built in.
# That was an acceptable risk bound to 127.0.0.1 on a home LAN; it is NOT
# once this is reachable from the public internet on an Oracle Cloud
# instance. This config is the minimum viable fix: nginx sits in front,
# requires a username/password before forwarding anything to the app.
#
# --- Setup ---
# 1. Install: sudo cp deploy/nginx-sfevents.conf /etc/nginx/sites-available/sfevents
#    sudo ln -s /etc/nginx/sites-available/sfevents /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default   # avoid the default site colliding on port 80
#
# 2. Create the password file (you'll be prompted for a password):
#    sudo apt install -y apache2-utils
#    sudo htpasswd -c /etc/nginx/.htpasswd <your_username>
#    (drop -c on subsequent users, so you don't overwrite the file)
#
# 3. Replace <YOUR_DOMAIN_OR_IP> below with your instance's public IP
#    (or a domain name if you have one pointed at it), then:
#    sudo nginx -t              # verify syntax before reloading - do this every time you edit this file
#    sudo systemctl reload nginx
#
# --- Optional: HTTPS via Let's Encrypt (only possible with a real domain,
# not a bare IP) ---
# sudo apt install -y certbot python3-certbot-nginx
# sudo certbot --nginx -d your-domain.com
# certbot rewrites this file to add the TLS block and a redirect from
# port 80 - safe to run after basic auth is already working over HTTP.

server {
    listen 80;
    server_name <YOUR_DOMAIN_OR_IP>;

    location / {
        auth_basic "SF Event Curator";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
