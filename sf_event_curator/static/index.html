<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Event Curator</title>
<style>
  :root { --border:#e2e2e2; --accent:#c0392b; --bg:#fafafa; --card:#fff; --text:#222; --muted:#777; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--card); }
  header h1 { font-size: 1.25rem; margin: 0; }
  main { max-width: 1240px; margin: 0 auto; padding: 1.5rem; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .toolbar input[type=text] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .toolbar label { font-size: 13px; display: flex; align-items: center; gap: 4px; color: var(--muted); }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 3px 8px; font-size: 12px; }
  .month-group { margin-bottom: 1.75rem; }
  .month-group h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .event-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 12px; }
  .event-main { flex: 1; }
  .event-date { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .event-title { font-weight: 600; margin: 2px 0 4px; }
  .event-meta { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; background: #eee; border-radius: 4px; padding: 2px 6px; margin-top: 6px; margin-right: 4px; }
  .badge.free { background: #e5f6ea; color: #1e7e34; }
  .event-actions { display: flex; flex-direction: column; gap: 6px; }
  dialog { border: none; border-radius: 10px; padding: 0; width: 420px; max-width: 90vw; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dialog-body { padding: 1.25rem; }
  .dialog-body h3 { margin-top: 0; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field input, .field textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 50px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .empty { color: var(--muted); font-size: 14px; padding: 2rem 0; text-align: center; }
  .calendar-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .calendar-nav h2 { margin: 0; font-size: 16px; min-width: 170px; text-align: center; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 1.25rem; }
  .cal-dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; text-transform: uppercase; }
  .cal-day { min-height: 74px; border: 1px solid var(--border); border-radius: 6px; padding: 4px; font-size: 11px; background: var(--card); cursor: pointer; }
  .cal-blank { min-height: 74px; }
  .cal-day.today { border-color: var(--accent); border-width: 2px; }
  .cal-day.selected { background: #fff3f0; border-color: var(--accent); }
  .cal-day-num { font-weight: 600; margin-bottom: 3px; }
  .cal-event-chip { background: #eee; border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event-chip.free { background: #e5f6ea; }
  .cal-more { font-size: 10px; color: var(--muted); }
  .day-detail h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
  .undated-note { font-size: 12px; color: var(--muted); margin-bottom: 1rem; }
  .cal-count { display: none; }
  @media (max-width: 640px) {
    .cal-day, .cal-blank { min-height: 56px; }
    /* Too narrow for titles: show just a count per day, tap for the detail. */
    .cal-event-chip, .cal-more { display: none; }
    .cal-count { display: block; font-size: 10px; color: var(--muted); }
  }
  .badge.score { background: #efe7ff; color: #5b21b6; font-variant-numeric: tabular-nums; }
  .badge.approx { background: #fff4e5; color: #92400e; }
  .badge.annual { background: #fff8e1; color: #8a6d00; }
  .event-why { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }
  .toolbar select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card); color: var(--text); }
  .rank-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  /* --- event media (carousel) --- */
  .event-media { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 10px; background: #f0f0f0; }
  .carousel-track { display: flex; transition: transform .25s ease; }
  .carousel-track img { width: 100%; flex: 0 0 100%; height: 190px; object-fit: cover; display: block; }
  .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); border: none; background: rgba(0,0,0,.55); color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; line-height: 1; padding: 0; cursor: pointer; }
  .carousel-btn.prev { left: 6px; }
  .carousel-btn.next { right: 6px; }
  .carousel-count { position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 7px; }
  /* --- when / where --- */
  .event-when { font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .event-where a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .event-where a:hover { text-decoration: underline; }
  /* --- pagination --- */
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 1.25rem 0 .5rem; }
  .pager span { font-size: 13px; color: var(--muted); }
  .pager button[disabled] { opacity: .4; cursor: default; }
  /* --- top picks of the week --- */
  .top-week { margin-bottom: 1.75rem; }
  .seasons { margin-bottom: 1.75rem; }
  .seasons h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .season-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
  .season { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .season-title { font-weight: 600; font-size: 14px; }
  .season-title a { color: var(--text); text-decoration: none; }
  .season-title a:hover { text-decoration: underline; }
  .season-title .badge { margin-right: 6px; }
  .season-when { font-size: 12px; color: var(--accent); margin: 3px 0 4px; }
  .season-desc { font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .season-more { margin-top: 8px; }
  .top-week h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .top-week .top-sub { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .top-pick { display: flex; gap: 10px; align-items: flex-start; }
  .top-rank { flex: 0 0 22px; font-size: 18px; font-weight: 700; color: var(--accent); line-height: 1.4; }
  .top-pick > .event-card { flex: 1; margin-bottom: 10px; }
  /* --- day map --- */
  .map-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .day-map { height: 320px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #eee; }
  .map-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 640px) {
    .carousel-track img { height: 150px; }
    .day-map { height: 240px; }
  }
  /* --- Yelp-style split: results left, persistent map right --- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  .map-col { position: sticky; top: 14px; }
  .side-map { height: 520px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #eef0f2; }
  .side-map-empty { display: flex; align-items: center; justify-content: center; height: 100%; padding: 1rem; text-align: center; font-size: 13px; color: var(--muted); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .map-col { position: static; order: -1; }
    .side-map { height: 260px; }
  }
  /* --- list <-> map selection --- */
  .event-card { cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; }
  .event-card:hover { border-color: #c9c9c9; }
  .event-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(192,57,43,.14); }
  .leaflet-marker-icon.marker-selected { filter: hue-rotate(140deg) saturate(1.7) drop-shadow(0 0 3px rgba(192,57,43,.9)); z-index: 10000 !important; }
  .map-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .map-hint.warn { color: var(--accent); }
  /* --- kind filter chips --- */
  .kind-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -6px 0 1.25rem; }
  .kind-chip { border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted); }
  .kind-chip[aria-pressed="true"] { background: #fff3f0; border-color: var(--accent); color: var(--accent); }
  .kind-chip .n { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 3px; }
  .kind-reset { border: none; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 4px 6px; }
  .day-cap { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>SF Event Curator</h1>
  <button class="primary" onclick="openCreateDialog()">+ Add event</button>
</header>
<main>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search title or venue..." oninput="resetPaging();render()">
    <label><input type="checkbox" id="freeOnly" onchange="resetPaging();render()"> Free only</label>
    <button onclick="loadEvents()">Refresh</button>
  </div>
  <div class="kind-chips" id="kindChips" role="group" aria-label="Kinds of event"></div>
  <div class="layout">
    <div class="results-col"><div id="results"></div></div>
    <aside class="map-col">
      <div class="side-map" id="sideMap"></div>
      <div class="map-note" id="sideMapNote"></div>
      <div class="map-hint" id="mapHint"></div>
    </aside>
  </div>
</main>

<dialog id="eventDialog">
  <form class="dialog-body" id="eventForm" onsubmit="return submitForm(event)">
    <h3 id="dialogTitle">Add event</h3>
    <input type="hidden" id="eventId">
    <div class="field"><label>Title</label><input id="f-title" required></div>
    <div class="field"><label>Start (date & time)</label><input id="f-start" type="datetime-local"></div>
    <div class="field"><label>End (date & time)</label><input id="f-end" type="datetime-local"></div>
    <div class="field"><label>Venue</label><input id="f-venue"></div>
    <div class="field"><label>Address</label><input id="f-address"></div>
    <div class="field"><label>Cost (e.g. 0 for free)</label><input id="f-cost"></div>
    <div class="field"><label>Categories (comma separated)</label><input id="f-categories"></div>
    <div class="field"><label>URL</label><input id="f-url"></div>
    <div class="field"><label>Notes</label><textarea id="f-description"></textarea></div>
    <div class="dialog-actions">
      <button type="button" onclick="closeDialog()">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
let allEvents = [];
let calYear, calMonth;   // month the calendar grid is showing
let selectedDay = null;  // 'YYYY-MM-DD' for the day list under the grid

// --- kinds: the filter ------------------------------------------------------
// Each source tags events its own way (Funcheap "Fairs & Festivals", DoTheBay
// "Theater & Performance", 19hz genre names), so the raw categories are too
// many and too uneven to filter on directly. They're folded into a handful of
// kinds here, and an event can belong to several: Outside Lands is Music *and*
// Festivals, so it stays visible with Music switched off. That replaces the
// old "hide music, except marquee festivals" special case.
const KINDS = [
  { id: 'seasonal', label: 'In Season', match: ['seasonal'] },
  { id: 'festivals', label: 'Festivals & Fairs', match: ['fairs & festivals', 'block party', 'oktoberfest', '**annual event**', 'festival'] },
  { id: 'arts', label: 'Arts & Film', match: ['art & museums', 'film', 'theater & performance', 'the arts', 'arts family', 'literature', 'lecture education', 'arts and culture', 'performance art', 'heritage', 'educational', 'dance'] },
  { id: 'community', label: 'Community & Food', match: ['community', 'kids & families', 'political activism', 'lgbtq', 'eating & drinking', 'free food', 'shopping', 'shopping & fashion', 'fun & games', 'experiences', 'family friendly', 'farmers market', 'market', 'food & drink', 'food', 'holiday', 'special event', 'attractions'] },
  { id: 'outdoors', label: 'Outdoors & Sports', match: ['outdoors', 'outdoor recreation', 'sports', 'sports & wellness', 'bike it', 'walks & tours', 'outdoor', 'nature', 'sporting events', 'sailing'] },
  { id: 'parks', label: 'Parks & Rec', match: ['parks & rec'] },
  { id: 'comedy', label: 'Comedy & Shows', match: ['comedy', 'variety'] },
  { id: 'music', label: 'Music & Nightlife', match: ['live music', 'music', 'club / dj', 'club/dj', 'dj', 'dj parties', 'live music & dance', 'jazz by the bay'] },
  { id: 'other', label: 'Other', match: [] },
];
// Music is off by default because profile.md pushes it down, and 19hz alone
// is ~550 club nights that would otherwise bury everything else.
const DEFAULT_OFF = new Set(['music']);
const KIND_STORE = 'sfec.kinds.v1';
let activeKinds = loadActiveKinds();

const kindOfLabel = {};
for (const k of KINDS) for (const m of k.match) kindOfLabel[m] = k.id;

function eventKinds(e) {
  if (e._kinds) return e._kinds;
  const kinds = new Set();
  // A season is only ever "In Season": whale watching also carries
  // Outdoors, but switching In Season off should hide the whole strip.
  if (isSeason(e)) {
    e._kinds = new Set(['seasonal']);
    return e._kinds;
  }
  if (e.source === '19hz_bayarea') kinds.add('music');
  for (const c of e.categories || []) {
    const k = kindOfLabel[String(c).trim().toLowerCase()];
    if (k) kinds.add(k);
  }
  if (!kinds.size) kinds.add('other');
  e._kinds = kinds;
  return kinds;
}

// What's stored is the kinds switched *off*, so a kind added later (In
// Season was) shows up on for everyone rather than silently hidden. v1
// stored the kinds switched on, over the kinds that existed then.
const KINDS_V1 = ['festivals', 'arts', 'community', 'outdoors', 'parks', 'comedy', 'music', 'other'];

function loadActiveKinds() {
  try {
    const saved = JSON.parse(localStorage.getItem(KIND_STORE));
    let off = null;
    if (saved && Array.isArray(saved.off)) off = new Set(saved.off);
    else if (Array.isArray(saved)) off = new Set(KINDS_V1.filter(id => !saved.includes(id)));
    if (off) return new Set(KINDS.map(k => k.id).filter(id => !off.has(id)));
  } catch (e) { /* private window or blocked storage: fall through */ }
  return defaultKinds();
}

function defaultKinds() {
  return new Set(KINDS.map(k => k.id).filter(id => !DEFAULT_OFF.has(id)));
}

function saveActiveKinds() {
  const off = KINDS.map(k => k.id).filter(id => !activeKinds.has(id));
  try { localStorage.setItem(KIND_STORE, JSON.stringify({ off })); } catch (e) { /* not critical */ }
}

function toggleKind(id) {
  if (activeKinds.has(id)) activeKinds.delete(id); else activeKinds.add(id);
  saveActiveKinds();
  resetPaging();
  render();
}

function resetKinds() {
  activeKinds = defaultKinds();
  saveActiveKinds();
  resetPaging();
  render();
}

function renderKindChips() {
  // Counts reflect the search box and Free only, but not the chips themselves,
  // so a switched-off kind still shows what turning it on would bring back.
  const base = baseFiltered();
  const counts = {};
  for (const e of base) for (const k of eventKinds(e)) counts[k] = (counts[k] || 0) + 1;
  const isDefault = activeKinds.size === defaultKinds().size
    && [...defaultKinds()].every(id => activeKinds.has(id));
  document.getElementById('kindChips').innerHTML = KINDS
    .filter(k => counts[k.id] || activeKinds.has(k.id))
    .map(k => `<button class="kind-chip" aria-pressed="${activeKinds.has(k.id)}" onclick="toggleKind('${k.id}')">`
      + `${escapeHtml(k.label)}<span class="n">${counts[k.id] || 0}</span></button>`)
    .join('')
    + (isDefault ? '' : '<button class="kind-reset" onclick="resetKinds()">Reset</button>');
}

async function loadEvents() {
  const res = await fetch('/api/events');
  allEvents = await res.json();
  // First load opens on today; a reload after an edit stays where you were.
  if (calYear == null) goToday(); else render();
}

function baseFiltered() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const freeOnly = document.getElementById('freeOnly').checked;
  return allEvents.filter(e => {
    if (freeOnly && !e.is_free) return false;
    if (search && !(e.title.toLowerCase().includes(search) || (e.venue || '').toLowerCase().includes(search))) return false;
    return true;
  });
}

function getFilteredEvents() {
  return baseFiltered().filter(e => [...eventKinds(e)].some(k => activeKinds.has(k)));
}

function render() {
  renderKindChips();
  renderCalendarView(getFilteredEvents());
}

// The day list pages 5 at a time and stops at 4 pages: past the top 20 of a
// single day the ranking has stopped telling you anything, and a busy
// Saturday can carry 100+ listings.
const PAGE_SIZE = 5;
const MAX_PAGES = 4;
let currentPage = 1;
const carouselIndex = {};
let leafletPromise = null;
let sideMap = null;
let sideMarkerLayer = null;

function resetPaging() {
  currentPage = 1;
}

function goToPage(n) {
  currentPage = n;
  render();
  const detail = document.querySelector('.day-detail');
  if (detail) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function rankedOrder(events) {
  // Scored first, best down; anything unranked trails in time order rather
  // than vanishing.
  const scored = events.filter(e => e.score != null).sort((a, b) => b.score - a.score);
  const unscored = events.filter(e => e.score == null).sort(byStart);
  return scored.concat(unscored);
}

function byStart(a, b) {
  return (a.start_ts || '').localeCompare(b.start_ts || '');
}

function pageSlice(list) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  return list.slice(start, start + PAGE_SIZE);
}

function pagerHtml(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  if (pages <= 1) return '';
  const first = (currentPage - 1) * PAGE_SIZE + 1;
  const last = Math.min(total, currentPage * PAGE_SIZE);
  return `<div class="pager">
    <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lsaquo; Prev</button>
    <span>${first}-${last} of ${total} &middot; page ${currentPage}/${pages}</span>
    <button onclick="goToPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>Next &rsaquo;</button>
  </div>`;
}

// --- in season --------------------------------------------------------------
// Seasons (whale watching, pumpkin patches, the crush) are windows you can go
// any day inside, often months long. On the grid they'd sit on their first
// day only, and in the top 5 they'd crowd out real events for months - so
// they get their own strip, following the month the grid is showing.
const SEASON_SOURCE = 'seasonal_bay_area';
const SEASONS_SHOWN = 6;
let seasonsExpanded = false;

function isSeason(e) {
  return e.source === SEASON_SOURCE;
}

function seasonsIn(events, year, month) {
  const from = dateKey(new Date(year, month, 1));
  const until = dateKey(new Date(year, month + 1, 0));
  return events
    .filter(e => isSeason(e) && e.start_ts)
    .filter(e => e.start_ts.slice(0, 10) <= until && (e.end_ts || e.start_ts).slice(0, 10) >= from)
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
}

function toggleSeasons() {
  seasonsExpanded = !seasonsExpanded;
  render();
}

function seasonsHtml(seasons) {
  if (!seasons.length) return '';
  const month = new Date(calYear, calMonth, 1).toLocaleString('en-US', { month: 'long' });
  const shown = seasonsExpanded ? seasons : seasons.slice(0, SEASONS_SHOWN);
  const more = seasons.length > SEASONS_SHOWN
    ? `<button class="season-more" onclick="toggleSeasons()">${seasonsExpanded ? 'Show fewer' : `Show all ${seasons.length}`}</button>`
    : '';
  return `<div class="seasons">
    <h2>In season in ${month}</h2>
    <div class="season-list">${shown.map(seasonHtml).join('')}</div>
    ${more}
  </div>`;
}

function seasonHtml(e) {
  const range = [e.start_ts, e.end_ts || e.start_ts]
    .map(ts => shortDate(ts.slice(0, 10))).join(' \u2013 ');
  const where = e.address || e.venue || '';
  const title = e.url
    ? `<a href="${escapeHtml(e.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(e.title)}</a>`
    : escapeHtml(e.title);
  const score = e.score != null
    ? `<span class="badge score" title="${escapeHtml(e.score_reason || '')}">${Math.round(e.score)}</span>`
    : '';
  return `<div class="season">
    <div class="season-title">${score}${title}</div>
    <div class="season-when">${e.date_approx ? 'Typically ' : ''}${range}${where ? ' &middot; ' + escapeHtml(where) : ''}</div>
    <div class="season-desc">${escapeHtml(e.description || '')}</div>
  </div>`;
}

// --- top 5 of the coming month ---------------------------------------------
// "The month" runs from today to the same date next month, not the calendar
// month: on the 28th, "September" would have almost nothing left in it. It
// also ignores which month the grid is showing, so paging the calendar to
// March doesn't change what's coming up.
function upcomingWindow() {
  const now = new Date();
  const until = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());
  return { from: dateKey(now), until: dateKey(until) };
}

function topPicks(events) {
  const { from, until } = upcomingWindow();
  // An event that started before today but is still running (a multi-day
  // festival) counts: it's something you can still go to.
  return events
    .filter(e => e.start_ts && e.score != null)
    .filter(e => {
      const start = e.start_ts.slice(0, 10);
      const end = (e.end_ts || e.start_ts).slice(0, 10);
      return start < until && end >= from;
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
}

function topPicksHtml(picks) {
  if (!picks.length) return '';
  const { from, until } = upcomingWindow();
  return `<div class="top-week">
    <h2>Top ${picks.length} this month</h2>
    <div class="top-sub">Best matches for profile.md between ${shortDate(from)} and ${shortDate(until)}.</div>
    ${picks.map((e, i) => `<div class="top-pick"><div class="top-rank">${i + 1}</div>${cardHtml(e)}</div>`).join('')}
  </div>`;
}

function shortDate(key) {
  return new Date(key + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedDay = null;
  resetPaging();
  render();
}

function goToday() {
  const d = new Date();
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  selectedDay = dateKey(d);
  resetPaging();
  render();
}

function selectDay(key) {
  if (selectedDay === key) return;
  selectedDay = key;
  resetPaging();
  render();
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderCalendarView(filtered) {
  const seasons = seasonsIn(filtered, calYear, calMonth);
  filtered = filtered.filter(e => !isSeason(e));
  const byDay = {};
  for (const e of filtered) {
    if (!e.start_ts) continue;
    const key = e.start_ts.slice(0, 10);
    (byDay[key] = byDay[key] || []).push(e);
  }

  const monthName = new Date(calYear, calMonth, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayKey = dateKey(new Date());
  const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let cells = '';
  for (let i = 0; i < firstWeekday; i++) cells += '<div class="cal-blank"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayEvents = byDay[key] || [];
    const byRank = rankedOrder(dayEvents);
    const classes = ['cal-day'];
    if (key === todayKey) classes.push('today');
    if (key === selectedDay) classes.push('selected');
    const chips = byRank.slice(0, 2).map(e =>
      `<div class="cal-event-chip${e.is_free ? ' free' : ''}">${escapeHtml(e.title)}</div>`
    ).join('');
    const more = dayEvents.length > 2 ? `<div class="cal-more">+${dayEvents.length - 2} more</div>` : '';
    const count = dayEvents.length
      ? `<div class="cal-count">${dayEvents.length} event${dayEvents.length === 1 ? '' : 's'}</div>`
      : '';
    cells += `<div class="${classes.join(' ')}" onclick="selectDay('${key}')">`
      + `<div class="cal-day-num">${day}</div>${chips}${more}${count}</div>`;
  }

  const picks = topPicks(filtered);
  const dayAll = selectedDay ? rankedOrder(byDay[selectedDay] || []) : [];
  const dayCapped = dayAll.slice(0, PAGE_SIZE * MAX_PAGES);
  const pageItems = pageSlice(dayCapped);

  document.getElementById('results').innerHTML = `
    ${topPicksHtml(picks)}
    ${seasonsHtml(seasons)}
    <div class="calendar-nav">
      <button onclick="changeMonth(-1)">&lsaquo; Prev</button>
      <h2>${monthName}</h2>
      <button onclick="changeMonth(1)">Next &rsaquo;</button>
      <button onclick="goToday()">Today</button>
    </div>
    <div class="calendar-grid">
      ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="day-detail">
      ${selectedDay ? dayDetailHtml(dayAll, dayCapped, pageItems) : '<div class="empty">Click a day to see its events.</div>'}
    </div>
  `;

  // The map carries everything on screen, top picks included - otherwise
  // clicking a pick reports "no pin" even though it has one.
  const onScreen = [];
  const seen = new Set();
  for (const e of pageItems.concat(picks)) {
    if (seen.has(e.id)) continue;
    seen.add(e.id);
    onScreen.push(e);
  }
  updateSideMap(onScreen, 'Nothing shown here has a mapped location.');
  applyCardSelection();
}

function dayDetailHtml(all, capped, pageItems) {
  const label = new Date(selectedDay + 'T00:00:00')
    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  if (!all.length) {
    return `<h3>${label}</h3><div class="empty">No events this day match the filters.</div>`;
  }
  const cap = all.length > capped.length
    ? `<div class="day-cap">Showing the top ${capped.length} of ${all.length}. Search or switch kinds off to see others.</div>`
    : '';
  return `<h3>${label}</h3>${pageItems.map(cardHtml).join('')}${pagerHtml(capped.length)}${cap}`;
}

function mediaHtml(e) {
  const images = (e.images || []).filter(Boolean);
  if (!images.length) return '';
  const idx = carouselIndex[e.id] || 0;
  // Hide the whole media block if the artwork is gone, not just the <img>:
  // Funcheap enclosure URLs in particular can point at uploads its CDN no
  // longer serves, and a hidden image inside a visible box leaves a grey
  // placeholder the height of a photo.
  const slides = images.map(src =>
    `<img src="${escapeHtml(src)}" alt="" loading="lazy" onerror="dropImage(this)">`
  ).join('');
  // Most events carry a single image; the controls only appear when there is
  // genuinely something to page through.
  const controls = images.length > 1 ? `
    <button class="carousel-btn prev" onclick="carouselStep(${e.id}, -1)" aria-label="Previous image">&lsaquo;</button>
    <button class="carousel-btn next" onclick="carouselStep(${e.id}, 1)" aria-label="Next image">&rsaquo;</button>
    <div class="carousel-count" id="cc-${e.id}">${idx + 1}/${images.length}</div>` : '';
  return `<div class="event-media">
    <div class="carousel-track" id="ct-${e.id}" style="transform:translateX(-${idx * 100}%)">${slides}</div>
    ${controls}
  </div>`;
}

function carouselStep(id, dir) {
  // Moves one carousel in place rather than re-rendering the list, so paging
  // through images doesn't reset scroll position.
  const track = document.getElementById('ct-' + id);
  if (!track) return;
  const count = track.children.length;
  const next = ((carouselIndex[id] || 0) + dir + count) % count;
  carouselIndex[id] = next;
  track.style.transform = `translateX(-${next * 100}%)`;
  const label = document.getElementById('cc-' + id);
  if (label) label.textContent = `${next + 1}/${count}`;
}

function dropImage(img) {
  const track = img.parentElement;
  img.remove();
  if (track && !track.children.length) {
    const media = track.parentElement;
    if (media) media.remove();
  }
}

function mapsUrl(e) {
  // Coordinates when the geocoder resolved them, otherwise let Google
  // interpret the text - a venue name is usually enough for it.
  const query = (e.lat != null && e.lon != null)
    ? `${e.lat},${e.lon}`
    : [e.venue, e.address].filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function locationHtml(e) {
  const venue = (e.venue || '').trim();
  const address = (e.address || '').trim();
  if (!venue && !address) return '';
  const url = escapeHtml(mapsUrl(e));
  const link = text =>
    `<div class="event-where"><a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)} &#8599;</a></div>`;

  // Show two lines only when the address says something the venue name
  // doesn't. Several sources put the same string in both fields, which
  // otherwise prints the venue twice, once plain and once as a link.
  const redundant = !address || address === venue
    || venue.includes(address) || address.includes(venue);
  if (redundant) return link(venue || address);
  return `<div class="event-meta">${escapeHtml(venue)}</div>` + link(address);
}

let selectedEventId = null;
const markerById = {};

function selectEvent(id, fromMap) {
  // Toggle off when re-selecting the same event, so there's always a way
  // back to "nothing in particular".
  selectedEventId = (selectedEventId === id) ? null : id;
  applyCardSelection();
  applyMarkerSelection();

  if (selectedEventId == null) return;

  if (fromMap) {
    const card = document.querySelector(`.event-card[data-event-id="${selectedEventId}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const marker = markerById[selectedEventId];
  const hint = document.getElementById('mapHint');
  if (marker && sideMap) {
    sideMap.setView(marker.getLatLng(), Math.max(sideMap.getZoom(), 14), { animate: true });
    marker.openPopup();
    if (hint) { hint.textContent = ''; hint.className = 'map-hint'; }
    // Below the split breakpoint the map sits above the list, so panning it
    // would otherwise happen off-screen.
    if (window.innerWidth <= 900) {
      const col = document.querySelector('.map-col');
      if (col) col.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  } else if (hint) {
    // Silence here would read as a broken click, so say why nothing moved.
    hint.textContent = 'This one has no mapped location, so there is no pin to show.';
    hint.className = 'map-hint warn';
  }
}

function applyCardSelection() {
  document.querySelectorAll('.event-card').forEach(card => {
    const id = Number(card.dataset.eventId);
    card.classList.toggle('selected', id === selectedEventId);
  });
}

function applyMarkerSelection() {
  for (const [id, marker] of Object.entries(markerById)) {
    const icon = marker._icon;
    if (!icon) continue;
    icon.classList.toggle('marker-selected', Number(id) === selectedEventId);
  }
}

function initSelectionHandlers() {
  // Delegated, because #results is rewritten on every render while this
  // container is not - so the handler is attached exactly once.
  const results = document.getElementById('results');
  if (!results) return;
  results.addEventListener('click', event => {
    // Links, buttons and carousel arrows keep their own behaviour.
    if (event.target.closest('a, button, input, select')) return;
    const card = event.target.closest('.event-card');
    if (!card || !card.dataset.eventId) return;
    selectEvent(Number(card.dataset.eventId), false);
  });
}

function updateSideMap(events, emptyMessage) {
  const container = document.getElementById('sideMap');
  const note = document.getElementById('sideMapNote');
  if (!container) return;

  const located = (events || []).filter(e => e.lat != null && e.lon != null);
  if (note) {
    note.textContent = located.length
      ? `${located.length} of ${events.length} shown here could be placed on the map.`
      : '';
  }

  if (!located.length) {
    // Tear the map down rather than leaving the previous pins behind, which
    // would show locations that aren't in the current results.
    if (sideMap) { sideMap.remove(); sideMap = null; sideMarkerLayer = null; }
    container.innerHTML = `<div class="side-map-empty">${escapeHtml(emptyMessage || 'Nothing here has a mapped location.')}</div>`;
    return;
  }

  loadLeaflet().then(L => {
    if (!sideMap) {
      container.innerHTML = '';
      sideMap = L.map(container).setView([located[0].lat, located[0].lon], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(sideMap);
      sideMarkerLayer = L.layerGroup().addTo(sideMap);
    }
    sideMarkerLayer.clearLayers();
    for (const key of Object.keys(markerById)) delete markerById[key];
    const markers = located.map(e => {
      const popup = `<strong>${escapeHtml(e.title)}</strong><br>${escapeHtml(e.venue || e.address || '')}`
        + `<br><a href="${escapeHtml(mapsUrl(e))}" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>`;
      const marker = L.marker([e.lat, e.lon]).bindPopup(popup).addTo(sideMarkerLayer);
      marker.on('click', () => selectEvent(e.id, true));
      markerById[e.id] = marker;
      return marker;
    });
    // The container is sized by CSS that may have changed since creation.
    sideMap.invalidateSize();
    applyMarkerSelection();
    if (markers.length > 1) {
      sideMap.fitBounds(L.featureGroup(markers).getBounds().pad(0.2), { maxZoom: 15 });
    } else {
      sideMap.setView([located[0].lat, located[0].lon], 14);
    }
  }).catch(() => {
    container.innerHTML = '<div class="side-map-empty">Map unavailable (could not load Leaflet).</div>';
  });
}

function loadLeaflet() {
  // Lazily loaded: the map is optional, and most visits never open it, so
  // the library shouldn't be on the critical path of every page load.
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    // Wait for the stylesheet as well as the script: a map built before
    // leaflet.css applies measures its container wrong and can fit the pins
    // at world zoom on a cold load.
    const cssReady = new Promise(done => {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
      css.onload = css.onerror = done;
      document.head.appendChild(css);
    });
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    js.onload = () => cssReady.then(() => resolve(window.L));
    js.onerror = () => reject(new Error('Leaflet failed to load'));
    document.head.appendChild(js);
  });
  return leafletPromise;
}

function formatWhen(e) {
  if (!e.start_ts) return 'Date TBD';
  const start = new Date(e.start_ts);
  const end = e.end_ts ? new Date(e.end_ts) : null;
  // Sources differ on whether they carry a time at all: the annual list and
  // DoTheBay are date-only, so their midnight timestamps would otherwise all
  // render as a confident, wrong "12:00 AM".
  const dateOnly = start.getHours() === 0 && start.getMinutes() === 0;
  const dayOpts = { weekday: 'short', month: 'short', day: 'numeric' };
  const timeOpts = { hour: 'numeric', minute: '2-digit' };

  let text = start.toLocaleDateString('en-US', dayOpts);
  if (!dateOnly) text += ', ' + start.toLocaleTimeString('en-US', timeOpts);

  if (end) {
    const sameDay = e.end_ts.slice(0, 10) === e.start_ts.slice(0, 10);
    if (sameDay && !dateOnly) {
      text += ' \u2013 ' + end.toLocaleTimeString('en-US', timeOpts);
    } else if (!sameDay) {
      text += ' \u2013 ' + end.toLocaleDateString('en-US', dayOpts);
    }
  }
  return e.date_approx ? `~ ${text}` : text;
}

function cardHtml(e) {
  const when = formatWhen(e);
  const badges = e.categories.slice(0, 3).map(c => `<span class="badge">${escapeHtml(c)}</span>`).join('');
  const freeBadge = e.is_free ? '<span class="badge free">Free</span>' : '';
  const scoreBadge = e.score != null
    ? `<span class="badge score" title="${escapeHtml(e.score_reason || '')}">${Math.round(e.score)}</span>`
    : '';
  const approxBadge = e.date_approx
    ? '<span class="badge approx" title="Follows a typical-year rule, not an announced date - confirm before making plans">date approx</span>'
    : '';
  const annualBadge = e.source === 'annual_bay_area' ? '<span class="badge annual">Annual</span>' : '';
  const why = e.score_reason ? `<div class="event-why">${escapeHtml(e.score_reason)}</div>` : '';
  return `
    <div class="event-card" data-event-id="${e.id}">
      <div class="event-main">
        ${mediaHtml(e)}
        <div class="event-when">${when}</div>
        <div class="event-title">${escapeHtml(e.title)}</div>
        ${locationHtml(e)}
        <div>${scoreBadge}${annualBadge}${approxBadge}${freeBadge}${badges}</div>
        ${why}
      </div>
      <div class="event-actions">
        <button class="small" onclick="openEditDialog(${e.id})">Edit</button>
        <button class="small" onclick="deleteEvent(${e.id})">Delete</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openCreateDialog() {
  document.getElementById('dialogTitle').textContent = 'Add event';
  document.getElementById('eventForm').reset();
  document.getElementById('eventId').value = '';
  document.getElementById('eventDialog').showModal();
}

function openEditDialog(id) {
  const e = allEvents.find(ev => ev.id === id);
  if (!e) return;
  document.getElementById('dialogTitle').textContent = 'Edit event';
  document.getElementById('eventId').value = e.id;
  document.getElementById('f-title').value = e.title;
  document.getElementById('f-start').value = toLocalInput(e.start_ts);
  document.getElementById('f-end').value = toLocalInput(e.end_ts);
  document.getElementById('f-venue').value = e.venue || '';
  document.getElementById('f-address').value = e.address || '';
  document.getElementById('f-cost').value = e.cost || '';
  document.getElementById('f-categories').value = (e.categories || []).join(', ');
  document.getElementById('f-url').value = e.url || '';
  document.getElementById('f-description').value = e.description || '';
  document.getElementById('eventDialog').showModal();
}

function toLocalInput(ts) {
  if (!ts) return '';
  return ts.slice(0, 16);
}

function closeDialog() {
  document.getElementById('eventDialog').close();
}

async function submitForm(evt) {
  evt.preventDefault();
  const id = document.getElementById('eventId').value;
  const payload = {
    title: document.getElementById('f-title').value,
    start: document.getElementById('f-start').value || null,
    end: document.getElementById('f-end').value || null,
    venue: document.getElementById('f-venue').value,
    address: document.getElementById('f-address').value,
    cost: document.getElementById('f-cost').value,
    categories: document.getElementById('f-categories').value.split(',').map(s => s.trim()).filter(Boolean),
    url: document.getElementById('f-url').value,
    description: document.getElementById('f-description').value,
  };
  const opts = { method: id ? 'PATCH' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) };
  await fetch(id ? `/api/events/${id}` : '/api/events', opts);
  closeDialog();
  loadEvents();
  return false;
}

async function deleteEvent(id) {
  if (!confirm('Delete this event?')) return;
  await fetch(`/api/events/${id}`, { method: 'DELETE' });
  loadEvents();
}

initSelectionHandlers();
loadEvents();
</script>
</body>
</html>
